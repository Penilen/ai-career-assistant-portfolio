name: Dashboard QA

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-qa.yml'

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install --global pnpm@10.34.3

      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check dashboard
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Run Node.js unit tests
        run: node --test unit-tests/*.test.ts

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      # Playwright starts both local servers for the browser tests.
      - name: Run Playwright tests
        run: pnpm test:e2e
